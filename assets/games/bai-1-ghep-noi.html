<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ghép nối khái niệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--muted:#5d6b85;--primary:#d88900;--teal:#1fa97a;--line:#f1dfb0;--shadow:0 12px 24px rgba(60,49,22,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:1rem;color:var(--ink);font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 90% 10%,rgba(124,228,200,.3),transparent 34%),linear-gradient(135deg,#fff8eb,#fef3d9)}button{font-family:inherit}.game{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;gap:1rem;align-items:center}.tag{background:var(--ink);color:#fff;border-radius:12px;padding:.3rem .75rem;font-weight:800;font-size:.88rem}.score{background:#fff;border:2px solid var(--line);border-radius:999px;padding:.35rem .9rem;font-weight:800}.score b{color:var(--primary)}h1{font:800 clamp(1.8rem,5vw,2.6rem)/1 'Be Vietnam Pro','Segoe UI',Arial,sans-serif;margin:.9rem 0 .2rem;color:var(--primary)}.lead{color:var(--muted);margin:0 0 1rem;line-height:1.5}.board{display:grid;grid-template-columns:1fr 1.45fr;gap:1rem}.column{display:flex;flex-direction:column;gap:.7rem}.column h2{font:800 1.3rem 'Be Vietnam Pro','Segoe UI',Arial,sans-serif;margin:0}.tile{border:3px solid var(--line);border-radius:16px;background:#fff;padding:.85rem 1rem;font-weight:800;line-height:1.35;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .2s,background .2s}.tile:hover{transform:translateY(-2px);border-color:var(--primary)}.tile.selected{border-color:var(--primary);background:#fff8e6;box-shadow:0 0 0 4px rgba(243,169,0,.18)}.tile.matched{border-color:var(--teal);background:#eafaf4;color:#15805b;cursor:default}.message{min-height:2em;margin:1rem 0 0;padding:.7rem .9rem;border-radius:14px;background:#fff8e6;font-weight:700;line-height:1.4}.message.ok{background:#eafaf4;color:#15805b}.reset{margin-top:.7rem;border:0;border-radius:999px;padding:.65rem 1.1rem;background:var(--primary);color:#fff;font-weight:800;box-shadow:0 4px 0 #a86400}@media(max-width:620px){body{padding:.75rem}.board{grid-template-columns:1fr;gap:1.2rem}.top{align-items:flex-start}}
</style></head>
<body><main class="game" aria-labelledby="title"><div class="top"><span class="tag">KHÁM PHÁ KIẾN THỨC</span><span class="score">Đã nối: <b id="score">0</b>/2</span></div><h1 id="title">Ghép nối khái niệm</h1><p class="lead">Chọn một thuật ngữ rồi chọn định nghĩa phù hợp ở cột bên phải.</p><section class="board"><div class="column" id="terms"><h2>Thuật ngữ</h2><button class="tile" data-id="info" type="button">💡 Thông tin</button><button class="tile" data-id="data" type="button">📦 Dữ liệu</button></div><div class="column" id="definitions"><h2>Định nghĩa</h2><button class="tile" data-id="data" type="button">Các con số, chữ cái, hình ảnh, âm thanh dùng để biểu diễn thông tin.</button><button class="tile" data-id="info" type="button">Điều em biết được từ sự vật, hiện tượng hoặc con người.</button></div></section><p class="message" id="message" role="status" aria-live="polite">Hãy bắt đầu bằng một thẻ ở cột Thuật ngữ.</p><button class="reset" id="reset" type="button">↻ Chơi lại</button></main>
<script>
const terms=document.querySelector('#terms'),definitions=document.querySelector('#definitions'),message=document.querySelector('#message'),score=document.querySelector('#score');let selected=null,matches=0;
terms.addEventListener('click',event=>{const tile=event.target.closest('.tile');if(!tile||tile.classList.contains('matched'))return;terms.querySelectorAll('.tile').forEach(item=>item.classList.remove('selected'));tile.classList.add('selected');selected=tile;message.textContent='Bây giờ chọn định nghĩa tương ứng.';message.className='message';});
definitions.addEventListener('click',event=>{const tile=event.target.closest('.tile');if(!tile||!selected||tile.classList.contains('matched'))return;if(tile.dataset.id===selected.dataset.id){selected.classList.remove('selected');selected.classList.add('matched');tile.classList.add('matched');selected=null;matches++;score.textContent=matches;message.textContent=matches===2?'🎉 Tuyệt vời! Em đã ghép đúng cả hai khái niệm.':'✅ Chính xác! Tiếp tục nối thẻ còn lại.';message.className='message ok';}else{tile.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:280});message.textContent='Chưa đúng, hãy đọc lại định nghĩa và thử lần nữa.';message.className='message';}});
document.querySelector('#reset').addEventListener('click',()=>location.reload());
</script>
<script>
message.hidden=true;
terms.addEventListener('click',()=>{message.hidden=false;});
</script></body></html>
