<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vòng quay tình huống</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--muted:#5d6b85;--primary:#d88900;--gold:#f3a900;--ok:#1fa97a;--bad:#e25555;--line:#f1dfb0;--shadow:0 14px 28px rgba(60,49,22,.14)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Nunito',sans-serif;background:radial-gradient(circle at 10% 10%,rgba(255,214,102,.35),transparent 35%),radial-gradient(circle at 90% 80%,rgba(124,228,200,.28),transparent 35%),linear-gradient(135deg,#fff8eb,#fef3d9);padding:1rem;overflow-x:hidden}button{font:inherit;cursor:pointer}.game{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin-bottom:.8rem}.tag{background:var(--ink);color:white;border-radius:12px;padding:.3rem .75rem;font-weight:800;font-size:.88rem}.score{background:white;border:2px solid var(--line);border-radius:999px;padding:.35rem .9rem;font-weight:800}.score b{color:var(--primary)}h1,h2{font-family:'Baloo 2',cursive;margin:0}h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.05;margin-bottom:.25rem}h1 span{color:var(--primary)}.lead{margin:.2rem 0 1rem;color:var(--muted);line-height:1.5}.layout{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(0,1.2fr);gap:1rem;align-items:center}.wheel-wrap{position:relative;display:grid;place-items:center}.pointer{position:absolute;z-index:2;top:-.4rem;color:var(--bad);font-size:2.4rem;filter:drop-shadow(0 3px 2px #fff)}.wheel{width:min(100%,280px);aspect-ratio:1;border-radius:50%;border:12px solid white;box-shadow:var(--shadow),inset 0 0 0 4px rgba(31,42,68,.12);background:conic-gradient(#f3a900 0deg 72deg,#f5c95f 72deg 144deg,#7cdcc0 144deg 216deg,#77a9eb 216deg 288deg,#f08ca7 288deg 360deg);transition:transform 3.2s cubic-bezier(.12,.8,.18,1);position:relative}.wheel:after{content:'?';position:absolute;inset:35%;display:grid;place-items:center;border-radius:50%;background:white;color:var(--primary);font-family:'Baloo 2';font-size:2.8rem;box-shadow:0 4px 12px rgba(0,0,0,.14)}.labels{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.labels span{position:absolute;font-weight:800;font-size:.78rem;color:white;text-shadow:0 1px 2px rgba(0,0,0,.35)}.labels span:nth-child(1){top:11%;right:23%}.labels span:nth-child(2){top:38%;right:3%}.labels span:nth-child(3){bottom:14%;right:21%}.labels span:nth-child(4){bottom:14%;left:20%}.labels span:nth-child(5){top:38%;left:3%}.panel{background:white;border-radius:22px;box-shadow:var(--shadow);padding:1rem;border-top:7px solid var(--primary)}.panel h2{font-size:1.45rem}.situation{background:#fff8e6;border-radius:14px;padding:.8rem;margin:.7rem 0;min-height:84px;display:grid;place-items:center;text-align:center;font-size:1.15rem;font-weight:800;line-height:1.4}.spin{display:block;width:100%;border:0;border-radius:999px;padding:.75rem 1.2rem;color:white;font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,var(--primary),var(--gold));box-shadow:0 5px 0 #a86400}.spin:disabled{opacity:.55;cursor:wait}.question{margin:.9rem 0 .6rem;font-weight:800}.answers{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.answer{border:3px solid var(--line);border-radius:16px;background:white;padding:.7rem;font-weight:800;color:var(--ink);transition:transform .15s,border-color .2s}.answer:hover{transform:translateY(-2px);border-color:var(--gold)}.answer:disabled{cursor:default}.answer.correct{border-color:var(--ok);background:#eafaf4;color:#15805b}.answer.wrong{border-color:var(--bad);background:#fff1f1;color:#b42323}.feedback{min-height:1.5em;margin:.7rem 0 0;font-weight:700;color:var(--muted);line-height:1.4}.feedback.ok{color:#15805b}.feedback.bad{color:#b42323}.tip{margin:.8rem 0 0;color:var(--muted);font-size:.88rem;line-height:1.4}@media(max-width:650px){body{padding:.75rem}.layout{grid-template-columns:1fr}.wheel{width:min(68vw,240px)}.panel{padding:.85rem}.top{align-items:flex-start}.answers{gap:.5rem}}
 .wheel:after{display:none}
 .wheel-center{position:absolute;z-index:2;inset:35%;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--primary);font-family:'Baloo 2';font-size:2.8rem;box-shadow:0 4px 12px rgba(0,0,0,.14);pointer-events:none}
 .labels{transform:none!important}
 .labels span{font-size:1.65rem;line-height:1;transform:translate(-50%,-50%)}
 .labels span:nth-child(1){top:18%;right:20%}
 .labels span:nth-child(2){top:42%;right:0}
 .labels span:nth-child(3){bottom:13%;right:20%}
 .labels span:nth-child(4){bottom:13%;left:27%}
 .labels span:nth-child(5){top:42%;left:7%}
 .labels span:nth-child(1){left:70.6%;top:21.7%;right:auto;bottom:auto}
 .labels span:nth-child(2){left:83.3%;top:60.8%;right:auto;bottom:auto}
 .labels span:nth-child(3){left:50%;top:85%;right:auto;bottom:auto}
 .labels span:nth-child(4){left:16.7%;top:60.8%;right:auto;bottom:auto}
 .labels span:nth-child(5){left:29.4%;top:21.7%;right:auto;bottom:auto}
 .spin{margin-bottom:.95rem}
 .answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
 .answer{min-height:62px;padding:.7rem .85rem}
</style>
</head>
<body>
<main class="game" aria-labelledby="title">
  <div class="top"><span class="tag">KHỞI ĐỘNG</span><span class="score">Điểm: <b id="score">0</b>/5</span></div>
  <h1 id="title">Vòng quay <span>tình huống</span></h1>
  <p class="lead">Bấm quay để chọn một tình huống. Sau đó, hãy quyết định đó là <strong>dữ liệu</strong> hay <strong>thông tin</strong>.</p>
  <section class="layout">
    <div class="wheel-wrap" aria-label="Vòng quay chọn tình huống">
      <div class="pointer" aria-hidden="true">▼</div>
      <div class="wheel" id="wheel"><div class="labels" aria-hidden="true"><span>🔔</span><span>🚦</span><span>🌧️</span><span>🌡️</span><span>📣</span></div><div class="wheel-center" aria-hidden="true">?</div></div>
    </div>
    <div class="panel">
      <h2 id="round">Sẵn sàng chưa?</h2>
      <div class="situation" id="situation" aria-live="polite"></div>
      <button class="spin" id="spin" type="button">🎡 Quay vòng quay</button>
      <div class="question" id="question" hidden>Em chọn đáp án nào?</div>
      <div class="answers" id="answers" hidden>
        <button class="answer" type="button" data-answer="data">📦 Dữ liệu</button>
        <button class="answer" type="button" data-answer="info">💡 Thông tin</button>
      </div>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <p class="tip">Gợi ý: dữ liệu là thứ được ghi lại bằng chữ, số, hình ảnh, âm thanh; thông tin là điều em hiểu được từ dữ liệu đó.</p>
    </div>
  </section>
</main>
<script>
const situations=[
  {text:'🔔 Nghe tiếng trống trường vang lên.',answer:'data',why:'Âm thanh là dữ liệu được thu nhận bằng tai.'},
  {text:'🚦 Thấy đèn giao thông chuyển sang màu đỏ.',answer:'data',why:'Màu sắc em nhìn thấy là dữ liệu hình ảnh.'},
  {text:'🌧️ Bản tin dự báo có mây đen và mưa lớn.',answer:'info',why:'Dự báo cho em biết thời tiết sắp xảy ra, đó là thông tin.'},
  {text:'🌡️ Nhiệt kế hiện số 30°C.',answer:'data',why:'Con số 30°C là dữ liệu được ghi trên nhiệt kế.'},
  {text:'📣 Nghe loa báo: "Tiết học bắt đầu lúc 8 giờ".',answer:'info',why:'Câu nói giúp em biết thời điểm bắt đầu tiết học.'}
];
const wheel=document.querySelector('#wheel'),spin=document.querySelector('#spin'),situation=document.querySelector('#situation'),answers=document.querySelector('#answers'),question=document.querySelector('#question'),feedback=document.querySelector('#feedback'),score=document.querySelector('#score'),round=document.querySelector('#round');
let current=null,used=new Set(),points=0,rotation=0;
function resetAnswer(){answers.hidden=true;question.hidden=true;feedback.textContent='';feedback.className='feedback';answers.querySelectorAll('button').forEach(button=>{button.disabled=false;button.className='answer'});}
spin.addEventListener('click',()=>{if(used.size===situations.length){used.clear();points=0;score.textContent=points;round.textContent='Chơi lại nào!';}let available=situations.map((_,index)=>index).filter(index=>!used.has(index));let index=available[Math.floor(Math.random()*available.length)];used.add(index);current=situations[index];rotation+=1080+(360-(index*72+36));wheel.style.transform=`rotate(${rotation}deg)`;spin.disabled=true;resetAnswer();situation.textContent='Đang chọn tình huống...';window.setTimeout(()=>{round.textContent=`Lượt ${used.size} / ${situations.length}`;situation.textContent=current.text;question.hidden=false;answers.hidden=false;spin.disabled=false;spin.textContent='🎡 Quay lượt khác';},3200);});
answers.addEventListener('click',(event)=>{const button=event.target.closest('button');if(!button||!current||button.disabled)return;answers.querySelectorAll('button').forEach(item=>item.disabled=true);const correct=button.dataset.answer===current.answer;button.classList.add(correct?'correct':'wrong');if(correct){points++;score.textContent=points;feedback.textContent=`✅ Chính xác! ${current.why}`;feedback.className='feedback ok';}else{const right=current.answer==='data'?'Dữ liệu':'Thông tin';feedback.textContent=`💭 Chưa đúng. Đáp án là ${right}. ${current.why}`;feedback.className='feedback bad';const rightButton=answers.querySelector(`[data-answer="${current.answer}"]`);rightButton.classList.add('correct');}});
</script>
<script>
const labelIcons=document.querySelectorAll('.labels span');
spin.addEventListener('click',()=>{labelIcons.forEach(icon=>{icon.style.transform=`translate(-50%,-50%) rotate(${-rotation}deg)`;});});
</script>
</body>
</html>
