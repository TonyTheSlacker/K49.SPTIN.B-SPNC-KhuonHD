<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cùng An vẽ sơ đồ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
html, body{margin:0; min-height:100%}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  font-family:'Nunito', 'Segoe UI', Verdana, Arial, sans-serif;
  background:linear-gradient(180deg,#fff8eb 0%,#fef3d9 100%);
  color:#1f2a44; padding:16px;
}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:3px solid #2563eb; outline-offset:2px}
.wrap{max-width:900px; margin:0 auto}

/* Đầu trang: tên phần, tiến độ, nút âm thanh */
.dau{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.ten-phan{flex:1; min-width:0; font-weight:900; font-size:19px}
.tien-do{display:flex; gap:6px}
.tien-do i{display:block; width:12px; height:12px; border-radius:50%; background:#e5e1d3}
.tien-do i.xong{background:#58a700}
.tien-do i.dang{background:#f3a900}
.nut-loa{flex:none; display:grid; place-items:center; width:38px; height:38px; border-radius:50%; border:2px solid #f1dfb0; background:#fff; color:#5d6b85}
.nut-loa svg{width:20px; height:20px}

/* Sơ đồ */
.so-do-hop{background:#fff; border-radius:18px; box-shadow:0 12px 30px rgba(58,45,16,.10); padding:8px}
.so-do{display:block; width:100%; height:auto}
.so-do text{font-family:'Nunito',sans-serif; font-weight:800}
.so-do .moi{animation:pop .45s cubic-bezier(.2,1.4,.4,1); transform-box:fill-box; transform-origin:center}
.so-do .bam{cursor:pointer}
@keyframes pop{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:none}}
.xong .so-do{max-width:620px; margin:0 auto}

/* Câu hỏi */
.hoi-hop{text-align:center; padding:10px 4px 2px}
.cau-goi{margin:0 0 6px; font-size:19px; font-weight:700; color:#5d6b85}
.cau-goi b{color:#1f2a44; background:#ffe98a; border-radius:6px; padding:0 4px}
.hoi{margin:0 0 12px; font-size:24px; font-weight:900; line-height:1.3}
.ds-nut{display:flex; flex-wrap:wrap; justify-content:center; gap:12px}
.nut-chon{
  min-width:150px; padding:13px 20px; background:#fff; color:#1f2a44; border:2px solid #f3a900; border-bottom-width:5px; border-radius:16px;
  font-weight:800; font-size:20px; line-height:1.25; transition:transform .08s, background .15s, border-bottom-width .08s;
}
.nut-chon:hover:not(:disabled){background:#fff8eb}
.nut-chon:active:not(:disabled){transform:translateY(3px); border-bottom-width:2px}
.nut-chon.dung{background:#eafff1; border-color:#22c55e; color:#15803d}
.nut-chon.sai{background:#fff1f1; border-color:#ef4444; animation:rung .4s}
.nut-chon.mo{opacity:.4}
.nut-chon:disabled{cursor:default}
.nut-chon.nhay{animation:nhay 1s ease-in-out infinite}
@keyframes rung{0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}
@keyframes nhay{0%,100%{box-shadow:0 0 0 0 rgba(243,169,0,.6)} 50%{box-shadow:0 0 0 8px rgba(243,169,0,0)}}
.tin{min-height:1.6em; margin:8px 0 0; font-size:19px; font-weight:800; line-height:1.35}
.tin.dung{color:#15803d}
.tin.sai{color:#b91c1c}

/* Ô gõ chữ của Phần 2 */
.go{display:flex; justify-content:center; gap:10px; max-width:520px; margin:0 auto}
.go input{flex:1; min-width:0; padding:12px 14px; border:2px solid #d5dbea; border-radius:14px; font:inherit; font-weight:800; font-size:20px; color:#1f2a44}
.go input:focus{outline:none; border-color:#f3a900}
.go .nut-chon{min-width:0; flex:none}
.goi-y-hop{margin-top:6px}
.go .nut-tiep{background:#f3a900; color:#fff; border-color:#c88400}
.go .nut-tiep:hover{background:#e29d00}
.nut-nho{padding:6px 14px; border:none; background:none; color:#b26b00; font-weight:800; font-size:17px; text-decoration:underline}
.goi-y{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:6px}
.goi-y button{padding:7px 14px; border:2px dashed #f3a900; border-radius:999px; background:#fffaf0; color:#1f2a44; font-weight:800; font-size:17px}

/* Màn đầu và màn xong */
.the{background:#fff; border-radius:18px; box-shadow:0 12px 30px rgba(58,45,16,.10); padding:22px; text-align:center}
.the h1, .the h2{margin:0 0 8px; font-weight:900}
.the h1{font-size:30px}
.the h2{font-size:24px; color:#d88900}
.the p{margin:0 0 16px; font-size:19px; line-height:1.45; color:#3b4660}
.the ol{display:inline-block; margin:0 0 16px; padding-left:1.4em; text-align:left; font-size:19px; font-weight:700; line-height:1.6}
.da-biet{list-style:none; margin:0 auto 14px; padding:0; display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.da-biet li{font-size:18px; font-weight:800; padding:6px 12px; background:#f3fbea; border-radius:12px}
.nut-chinh{padding:13px 30px; border:none; border-radius:999px; color:#fff; background:#f3a900; box-shadow:0 5px 0 #c88400; font-weight:900; font-size:20px}
.nut-chinh:active{transform:translateY(3px); box-shadow:0 2px 0 #c88400}
.nut-phu{margin-left:10px; padding:11px 22px; border:2px solid #f3a900; border-radius:999px; background:#fff; color:#d88900; font-weight:800; font-size:18px}
.ket{margin-top:12px; padding:16px}
.ket h2{margin-bottom:10px}
.anh-giay{margin:0 auto 12px; max-width:520px; min-height:120px; display:grid; place-items:center; border:2px dashed #d5dbea; border-radius:14px; color:#8a93a8; font-weight:700; overflow:hidden}
.anh-giay img{display:block; width:100%; height:auto}
.chon-anh{position:relative; overflow:hidden}
.chon-anh input{position:absolute; inset:0; opacity:0; cursor:pointer}
.ghi-chu{margin:10px 0 0 !important; font-size:15px !important; color:#8a93a8 !important}

@media (max-width: 560px){
  body{padding:10px}
  .ten-phan{font-size:16px}
  .tien-do i{width:9px; height:9px}
  .cau-goi{font-size:17px}
  .hoi{font-size:21px}
  .ds-nut{gap:8px}
  .nut-chon{min-width:0; flex:1 1 40%; padding:11px 12px; font-size:18px}
  .go input{font-size:18px}
  .tin{font-size:17px}
  .the{padding:16px}
  .the h1{font-size:25px}
  .the p, .the ol, .da-biet li{font-size:17px}
  .nut-phu{margin:10px 0 0}
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="dau">
    <div class="ten-phan" id="tenPhan"></div>
    <div class="tien-do" id="tienDo" aria-hidden="true"></div>
    <button type="button" class="nut-loa" id="nutLoa" title="Bật hoặc tắt tiếng" aria-label="Bật hoặc tắt tiếng"></button>
  </div>
  <main id="man"></main>
</div>

<script>
/* =========================================================
   CÙNG AN VẼ SƠ ĐỒ – Tin học 6, Bài 10: Luyện tập & Vận dụng
   Phần 1 (Luyện tập): mỗi màn một câu hỏi, sơ đồ của An lớn dần sau mỗi câu đúng.
   Phần 2 (Vận dụng): em tự vẽ sơ đồ về chính em, cũng từng bước một.
   CẤU HÌNH: giáo viên sửa câu hỏi, gợi ý, màu ở đây
   ========================================================= */
const CAU_HINH = {
  chuDe: 'Bạn An',
  nhanh: [
    { id: 'fam',   ten: 'Gia đình', mau: '#d6336c', hinh: '🏠' },
    { id: 'hob',   ten: 'Sở thích', mau: '#e8590c', hinh: '⚽' },
    { id: 'sub',   ten: 'Môn học',  mau: '#1c7ed6', hinh: '💻' },
    { id: 'dream', ten: 'Ước mơ',   mau: '#2f9e44', hinh: '🚀' }
  ],
  saiToiDa: 3,          // sai bằng số lần này thì làm lại câu đó
  choSangCauMs: 1600,   // trả lời đúng, chờ để em đọc lời khen rồi mới sang câu sau
  cau: [
    { loai: 'giua', hoi: 'Chữ nào đặt ở giữa sơ đồ?',
      dapAn: [
        { t: 'Bạn An', dung: true },
        { t: 'Gia đình', sai: '“Gia đình” chỉ là một nhánh. Sơ đồ đang nói về ai?' },
        { t: 'đá bóng', sai: '“đá bóng” chỉ là một chi tiết nhỏ. Sơ đồ đang nói về ai?' }
      ],
      dung: 'Đúng rồi! Chủ đề chính đặt ở giữa.' },
    { loai: 'nhanh', hoi: 'Bấm chọn 4 chủ đề nhánh.',
      nhieu: { t: 'đá bóng', sai: '“đá bóng” là từ khóa nhỏ, không phải nhánh.' },
      dung: 'Đúng rồi! Mỗi nhánh là một ý lớn.' },
    { loai: 'ngan', hoi: 'Trên nhánh Sở thích nên ghi thế nào?', nhanh: 'hob',
      dapAn: [
        { t: 'đá bóng', dung: true },
        { t: 'Mình rất thích đá bóng mỗi buổi chiều', sai: 'Câu dài làm sơ đồ rối. Chỉ ghi từ khóa ngắn thôi.' }
      ],
      dung: 'Đúng rồi! Trên nhánh chỉ ghi từ khóa ngắn.' },
    { loai: 'tuKhoa', tu: 'bố', nhanh: 'fam', goi: 'Nhà mình có bố, mẹ và em gái.', sai: '“bố” là người trong gia đình An.' },
    { loai: 'tuKhoa', tu: 'Tin học', nhanh: 'sub', goi: 'Ở trường, mình thích nhất môn Tin học.', sai: '“Tin học” là một môn học ở trường.' },
    { loai: 'tuKhoa', tu: 'kĩ sư phần mềm', nhanh: 'dream', goi: 'Lớn lên, mình muốn làm kĩ sư phần mềm.', sai: '“kĩ sư phần mềm” là điều An mong muốn sau này.' },
    { loai: 'mau', hoi: 'Bấm từng nhánh để tô màu và thêm hình.',
      dung: 'Tuyệt vời! Màu và hình giúp sơ đồ dễ nhìn, dễ nhớ.' }
  ],
  daBiet: ['Chủ đề chính đặt ở giữa.', 'Mỗi nhánh là một ý lớn, có màu riêng.', 'Trên nhánh chỉ ghi từ khóa ngắn.'],

  // Phần 2: sơ đồ về em
  phan2: {
    soNhanh: 3,         // số nhánh em chọn (sơ đồ đang xếp chỗ cho đúng 3 nhánh)
    toiDaTu: 3,         // mỗi nhánh ghi tối đa bấy nhiêu từ khóa (ít nhất 1)
    daiTu: 15,          // từ khóa dài hơn số chữ này, hoặc hơn 3 tiếng, thì nhắc em viết gọn lại
    daiTen: 18,
    nhanh: [
      { ten: 'Gia đình', mau: '#d6336c', goiY: ['bố', 'mẹ', 'ông bà'] },
      { ten: 'Sở thích', mau: '#e8590c', goiY: ['đọc truyện', 'đá bóng', 'vẽ tranh'] },
      { ten: 'Môn học',  mau: '#1c7ed6', goiY: ['Tin học', 'Toán', 'Tiếng Anh'] },
      { ten: 'Ước mơ',   mau: '#2f9e44', goiY: ['bác sĩ', 'giáo viên', 'kĩ sư'] },
      { ten: 'Bạn thân', mau: '#7048e8', goiY: ['học nhóm', 'đá cầu', 'chơi cờ'] }
    ],
    giay: ['Viết tên em ở giữa tờ giấy.', 'Vẽ 3 nhánh, ví dụ: gia đình, sở thích, ước mơ.', 'Mỗi nhánh ghi 1–2 từ khóa ngắn.', 'Tô mỗi nhánh một màu rồi chụp ảnh lại.']
  }
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const xao = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const nhanhCua = id => CAU_HINH.nhanh.find(n => n.id === id);

/* ---------- Âm thanh ngắn khi đúng, sai ---------- */
let coTieng = true, actx = null;
function tieng(dung) {
  if (!coTieng) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    (dung ? [[880, 0], [1320, .1]] : [[260, 0], [200, .12]]).forEach(([f, tre]) => {
      const t = actx.currentTime + tre, o = actx.createOscillator(), g = actx.createGain();
      o.type = dung ? 'sine' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.15, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .35);
    });
  } catch (e) {}
}
const LOA = {
  bat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></svg>',
  tat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 10l5 5"/><path d="M21 10l-5 5"/></svg>'
};
function veLoa() { $('#nutLoa').innerHTML = coTieng ? LOA.bat : LOA.tat; }
$('#nutLoa').addEventListener('click', () => { coTieng = !coTieng; veLoa(); });

/* =========================================================
   VẼ SƠ ĐỒ (SVG), dùng chung cho hai phần
   Khung rộng: nhánh hai bên chủ đề chính. Khung hẹp (điện thoại): nhánh ở trên và dưới.
   ========================================================= */
const KHUON = {
  rong: { 4: { w: 760, h: 330, c: [380, 165], vt: [[150, 68], [610, 68], [150, 250], [610, 250]] },
          3: { w: 760, h: 380, c: [380, 160], vt: [[150, 62], [610, 62], [380, 280]] } },
  hep:  { 4: { w: 360, h: 440, c: [180, 220], vt: [[88, 58], [272, 58], [88, 330], [272, 330]] },
          3: { w: 360, h: 476, c: [180, 214], vt: [[88, 58], [272, 58], [180, 362]] } }
};
const CO = { rong: { cw: 190, ch: 62, maxCw: 320, bw: 185, bh: 54, co: 25, coNho: 20 },
             hep:  { cw: 150, ch: 54, maxCw: 230, bw: 156, bh: 46, co: 20, coNho: 16 } };
const XAM = '#9aa3b5';
const kieu = () => ($('#soDoHop') && $('#soDoHop').clientWidth < 480 ? 'hep' : 'rong');
const rongChu = (t, co) => t.length * co * .56 + 26;
const chuSvg = (x, y, co, mau, t, them = '') => `<text x="${x}" y="${y}" font-size="${co}" fill="${mau}" text-anchor="middle" dominant-baseline="central"${them}>${esc(t)}</text>`;

/* m: { giua: chữ ở giữa hoặc rỗng, soO: số chỗ nhánh, cho: hiện chỗ trống,
        nhanh: [{ key, o (chỗ), ten, mau, hinh, daMau, tu: [] }], dai: { o, t } câu dài ghi thử }
   moi: các phần vừa thêm, để hiện có hiệu ứng */
const moi = new Set();
let moHinh = null, bamNhanh = null, veLai = () => {};
function veSoDo() {
  const hop = $('#soDoHop');
  if (!hop || !moHinh) return;
  const k = kieu(), m = moHinh, kh = KHUON[k][m.soO], co = CO[k], [cx, cy] = kh.c, cl = key => (moi.has(key) ? ' moi' : '');
  const lot = [], tren = [];
  const coNhanh = new Set(m.nhanh.map(n => n.o));
  if (m.cho) kh.vt.forEach(([x, y], o) => {
    if (!coNhanh.has(o)) tren.push(`<rect x="${x - co.bw / 2}" y="${y - co.bh / 2}" width="${co.bw}" height="${co.bh}" rx="14" fill="#fafafa" stroke="#d5d9e8" stroke-width="2.5" stroke-dasharray="7 6"/>`);
  });
  const chuGiua = m.giua || '', cw = Math.min(co.maxCw, Math.max(co.cw, rongChu(chuGiua, co.co + 2) + 10));
  const coGiua = Math.min(co.co + 2, (cw - 26) / Math.max(1, chuGiua.length * .56));
  m.nhanh.forEach(n => {
    const [x, y] = kh.vt[n.o], mauNhanh = n.daMau ? n.mau : XAM, dx = x - cx, dy = y - cy;
    let d;
    if (Math.abs(dx) > Math.abs(dy)) {
      const x1 = cx + Math.sign(dx) * (cw / 2 - 8), x2 = x - Math.sign(dx) * co.bw / 2, g = (x1 + x2) / 2;
      d = `M${x1} ${cy} C${g} ${cy} ${g} ${y} ${x2} ${y}`;
    } else {
      // Nhánh ở trên hoặc dưới: nối vào góc trong của nhánh để đường không đi xuyên qua các từ khóa
      const x1 = cx + Math.sign(dx) * 34, y1 = cy + Math.sign(dy) * co.ch / 2, y2 = y - Math.sign(dy) * co.bh / 2, g = (y1 + y2) / 2;
      const x2 = x - Math.sign(dx) * (co.bw / 2 - 18);
      d = `M${x1} ${y1} C${x1} ${g} ${x2} ${g} ${x2} ${y2}`;
    }
    lot.push(`<path d="${d}" fill="none" stroke="${mauNhanh}" stroke-width="5" stroke-linecap="round" class="${cl('n-' + n.key).trim()}"/>`);
    tren.push(`<g class="bam${cl('n-' + n.key)}${cl('m-' + n.key)}" data-nhanh="${n.key}"><rect x="${x - co.bw / 2}" y="${y - co.bh / 2}" width="${co.bw}" height="${co.bh}" rx="14" fill="${n.daMau ? n.mau : '#eef0f5'}" stroke="${mauNhanh}" stroke-width="2.5"/>
      ${chuSvg(x, y, co.co, n.daMau ? '#fff' : '#1f2a44', (n.daMau ? n.hinh + ' ' : '') + n.ten)}</g>`);
    // Từ khóa nằm ngay dưới nhánh; chữ dài thì dịch vào trong cho khỏi ra ngoài khung
    n.tu.forEach((t, i) => {
      const w = rongChu(t, co.coNho), ty = y + co.bh / 2 + 22 + i * 36, tx = Math.max(6 + w / 2, Math.min(kh.w - 6 - w / 2, x));
      tren.push(`<g class="${cl('t-' + n.key + '-' + t).trim()}"><line x1="${x}" y1="${y + co.bh / 2}" x2="${x}" y2="${ty - 15}" stroke="${mauNhanh}" stroke-width="3"/>
        <rect x="${tx - w / 2}" y="${ty - 15}" width="${w}" height="30" rx="15" fill="#fff" stroke="${mauNhanh}" stroke-width="2.5"/>
        ${chuSvg(tx, ty, co.coNho, '#1f2a44', t)}</g>`);
    });
  });
  // Câu dài ghi thử lên nhánh khi em chọn sai, để thấy sơ đồ rối thế nào
  if (m.dai) {
    const [x, y] = kh.vt[m.dai.o], w = Math.min(kh.w - 20, rongChu(m.dai.t, co.coNho - 2));
    const tx = Math.max(10 + w / 2, Math.min(kh.w - 10 - w / 2, x)), ty = y + co.bh / 2 + 22;
    tren.push(`<g class="moi"><rect x="${tx - w / 2}" y="${ty - 15}" width="${w}" height="30" rx="15" fill="#fff1f1" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
      ${chuSvg(tx, ty, co.coNho - 2, '#b91c1c', m.dai.t)}</g>`);
  }
  const giua = chuGiua
    ? `<g class="${cl('giua').trim()}"><rect x="${cx - cw / 2}" y="${cy - co.ch / 2}" width="${cw}" height="${co.ch}" rx="${co.ch / 2}" fill="#FF9600"/>
        ${chuSvg(cx, cy, coGiua, '#fff', chuGiua, ' font-weight="900"')}</g>`
    : `<rect x="${cx - cw / 2}" y="${cy - co.ch / 2}" width="${cw}" height="${co.ch}" rx="${co.ch / 2}" fill="#fafafa" stroke="#d5d9e8" stroke-width="2.5" stroke-dasharray="7 6"/>
       ${chuSvg(cx, cy, co.co + 4, '#b6bccb', '?')}`;
  hop.innerHTML = `<svg class="so-do" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${kh.w} ${kh.h}" width="${kh.w}" height="${kh.h}" role="img" aria-label="Sơ đồ tư duy">${lot.join('')}${giua}${tren.join('')}</svg>`;
  moi.clear();
  $$('[data-nhanh]', hop).forEach(g => g.addEventListener('click', () => { if (bamNhanh) bamNhanh(g.dataset.nhanh); }));
}

/* =========================================================
   KHUNG CHUNG CỦA MỘT MÀN CÂU HỎI
   ========================================================= */
const S = { cau: 0, sd: null, saiLan: 0, khoa: false, hen: null };
function veTienDo(n, dang) {
  $('#tienDo').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < dang ? 'xong' : i === dang ? 'dang' : ''}"></i>`).join('');
}
function khungCau() {
  $('#man').innerHTML = `<div class="so-do-hop" id="soDoHop"></div>
    <div class="hoi-hop">
      <p class="cau-goi" id="cauGoi" hidden></p>
      <h2 class="hoi" id="hoi"></h2>
      <div id="vung"></div>
      <p class="tin" id="tin" role="status" aria-live="polite"></p>
    </div>`;
}
function baoTin(lop, chu) { const t = $('#tin'); t.className = 'tin ' + lop; t.textContent = chu; }
function nutHTML(ds) { return `<div class="ds-nut" id="dsNut">${ds.map(d => `<button type="button" class="nut-chon" data-t="${esc(d.t)}">${esc(d.t)}</button>`).join('')}</div>`; }
function manXongChung(tieuDe, giua, nutHtml) {
  $('#soDoHop').classList.add('xong');
  $('.hoi-hop').outerHTML = `<div class="the ket"><h2>${esc(tieuDe)}</h2>${giua}<div>${nutHtml}</div></div>`;
}

/* =========================================================
   MÀN ĐẦU
   ========================================================= */
function manDau() {
  clearTimeout(S.hen);
  bamNhanh = null;
  $('#tenPhan').textContent = 'Luyện tập & Vận dụng';
  $('#tienDo').innerHTML = '';
  $('#man').innerHTML = `<div class="the">
      <h1>Cùng An vẽ sơ đồ tư duy</h1>
      <p>Phần 1: em giúp bạn An vẽ sơ đồ giới thiệu bản thân.<br>Phần 2: em tự vẽ sơ đồ về chính em.</p>
      <button type="button" class="nut-chinh" id="nutBatDau">Bắt đầu</button><button type="button" class="nut-phu" id="nutDenP2">Làm Phần 2</button>
    </div>`;
  $('#nutBatDau').addEventListener('click', batDauP1);
  $('#nutDenP2').addEventListener('click', manDauP2);
}

/* =========================================================
   PHẦN 1 – LUYỆN TẬP: CÙNG AN VẼ SƠ ĐỒ
   ========================================================= */
function batDauP1() {
  S.sd = { giua: false, cho: false, nhanh: [], tu: {}, mau: [], dai: false };
  $('#tenPhan').textContent = 'Phần 1 · Cùng An vẽ sơ đồ';
  khungCau();
  moCau(0);
}
// Dựng sơ đồ của An từ các câu em đã trả lời
function moHinhP1() {
  const sd = S.sd;
  return {
    giua: sd.giua ? CAU_HINH.chuDe : '', soO: 4, cho: sd.cho,
    nhanh: CAU_HINH.nhanh.map((n, o) => sd.nhanh.includes(n.id)
      ? { key: n.id, o, ten: n.ten, mau: n.mau, hinh: n.hinh, daMau: sd.mau.includes(n.id), tu: sd.tu[n.id] || [] } : null).filter(Boolean),
    dai: sd.dai ? { o: CAU_HINH.nhanh.findIndex(n => n.id === 'hob'), t: 'Mình rất thích đá bóng mỗi buổi chiều' } : null
  };
}
function veP1() { veLai = veP1; moHinh = moHinhP1(); veSoDo(); }

function moCau(i) {
  clearTimeout(S.hen);
  S.cau = i; S.saiLan = 0; S.khoa = false;
  const c = CAU_HINH.cau[i];
  if (!c) { manXongP1(); return; }
  if (!$('#soDoHop')) khungCau();
  veTienDo(CAU_HINH.cau.length, i);
  if (c.loai === 'nhanh') S.sd.cho = true;
  bamNhanh = c.loai === 'mau' ? toMau : null;
  veP1();
  $('#cauGoi').hidden = c.loai !== 'tuKhoa';
  if (c.loai === 'tuKhoa') $('#cauGoi').innerHTML = '“' + esc(c.goi).replace(esc(c.tu), `<b>${esc(c.tu)}</b>`) + '”';
  $('#hoi').textContent = c.loai === 'tuKhoa' ? `“${c.tu}” thuộc nhánh nào?` : c.hoi;
  baoTin('', '');
  let ds;
  if (c.loai === 'giua' || c.loai === 'ngan') ds = xao(c.dapAn);
  else if (c.loai === 'nhanh') ds = xao([...CAU_HINH.nhanh.map(n => ({ t: n.ten, id: n.id, dung: true })), c.nhieu]);
  else if (c.loai === 'tuKhoa') ds = CAU_HINH.nhanh.map(n => ({ t: n.ten, id: n.id, dung: n.id === c.nhanh, sai: c.sai }));
  else ds = CAU_HINH.nhanh.map(n => ({ t: n.ten, id: n.id }));
  $('#vung').innerHTML = nutHTML(ds);
  $$('#dsNut .nut-chon').forEach((b, k) => b.addEventListener('click', () => chon(b, ds[k])));
}
function chon(b, d) {
  const c = CAU_HINH.cau[S.cau];
  if (S.khoa || b.disabled) return;
  if (c.loai === 'mau') { toMau(d.id); return; }
  if (!d.dung) { chonSai(b, d.sai, c); return; }
  tieng(true);
  b.classList.remove('nhay');
  b.classList.add('dung');
  b.disabled = true;
  if (c.loai === 'giua') { S.sd.giua = true; moi.add('giua'); }
  if (c.loai === 'nhanh') {
    S.sd.nhanh.push(d.id); moi.add('n-' + d.id);
    veP1();
    const con = CAU_HINH.nhanh.length - S.sd.nhanh.length;
    if (con > 0) { baoTin('dung', `Đúng rồi! Còn ${con} nhánh nữa.`); return; }
    S.sd.cho = false;
  }
  if (c.loai === 'ngan') { S.sd.dai = false; S.sd.tu[c.nhanh] = ['đá bóng']; moi.add('t-' + c.nhanh + '-đá bóng'); }
  if (c.loai === 'tuKhoa') { (S.sd.tu[c.nhanh] = S.sd.tu[c.nhanh] || []).push(c.tu); moi.add('t-' + c.nhanh + '-' + c.tu); }
  veP1();
  daXongCau(c.loai === 'tuKhoa' ? `Đúng rồi! “${c.tu}” thuộc nhánh ${nhanhCua(c.nhanh).ten}.` : c.dung);
}
function daXongCau(loiKhen) {
  S.khoa = true;
  $$('#dsNut .nut-chon').forEach(x => { x.disabled = true; });
  baoTin('dung', loiKhen);
  S.hen = setTimeout(() => moCau(S.cau + 1), CAU_HINH.choSangCauMs);
}
// Sai: nút rung rồi mờ đi. Sai 2 lần thì đáp án đúng nhấp nháy; sai đủ số lần thì làm lại câu này, sơ đồ vẫn giữ.
function chonSai(b, loi, c) {
  tieng(false);
  S.saiLan++;
  b.classList.add('sai');
  b.disabled = true;
  setTimeout(() => { b.classList.remove('sai'); b.classList.add('mo'); }, 420);
  if (c.loai === 'ngan') { S.sd.dai = true; veP1(); }
  if (S.saiLan >= CAU_HINH.saiToiDa) {
    S.khoa = true;
    baoTin('sai', `Em đã sai ${CAU_HINH.saiToiDa} lần. Mình làm lại câu này nhé!`);
    S.hen = setTimeout(() => moCau(S.cau), 1800);
    return;
  }
  baoTin('sai', loi);
  if (S.saiLan >= 2) $$('#dsNut .nut-chon').forEach(x => {
    const t = x.dataset.t, dung = c.loai === 'giua' || c.loai === 'ngan' ? c.dapAn.some(a => a.t === t && a.dung)
      : c.loai === 'tuKhoa' && nhanhCua(c.nhanh).ten === t;
    if (dung) x.classList.add('nhay');
  });
}
function toMau(id) {
  const c = CAU_HINH.cau[S.cau];
  if (!c || c.loai !== 'mau' || S.khoa || S.sd.mau.includes(id)) return;
  tieng(true);
  S.sd.mau.push(id); moi.add('m-' + id);
  veP1();
  const b = $$('#dsNut .nut-chon').find(x => x.dataset.t === nhanhCua(id).ten);
  if (b) { b.classList.add('dung'); b.disabled = true; }
  const con = CAU_HINH.nhanh.length - S.sd.mau.length;
  if (con > 0) { baoTin('dung', `Còn ${con} nhánh nữa.`); return; }
  daXongCau(c.dung);
}
function manXongP1() {
  bamNhanh = null;
  veTienDo(CAU_HINH.cau.length, CAU_HINH.cau.length);
  manXongChung('Em đã giúp An vẽ xong sơ đồ tư duy!',
    `<ul class="da-biet">${CAU_HINH.daBiet.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`,
    '<button type="button" class="nut-chinh" id="nutPhan2">Sang Phần 2</button><button type="button" class="nut-phu" id="nutLai">Làm lại</button>');
  $('#nutLai').addEventListener('click', batDauP1);
  $('#nutPhan2').addEventListener('click', manDauP2);
}

/* =========================================================
   PHẦN 2 – VẬN DỤNG: SƠ ĐỒ VỀ EM
   Các bước: gõ tên, chọn nhánh, gõ từ khóa cho từng nhánh, tô màu.
   ========================================================= */
const P2C = CAU_HINH.phan2;
let p2 = null;
const soBuocP2 = () => 2 + P2C.soNhanh + 1;

/* Sơ đồ về em: mỗi từ khóa có đường nối riêng từ nhánh, nên ghi 1 hay 3 từ khóa đều rõ ràng.
   Khung rộng: 2 nhánh ở trên hai bên, 1 nhánh ở dưới. Khung hẹp (điện thoại): xếp thành cây dọc. */
const P2KHUON = {
  rong: { w: 760, c: [380, 192], cw: 210, maxCw: 250, ch: 64, bw: 190, bh: 56, co: 26, coNho: 21,
          vt: [[110, 52], [650, 52], [380, 304]] },
  hep:  { w: 360, c: [180, 40], cw: 200, maxCw: 330, ch: 56, bw: 150, bh: 48, co: 21, coNho: 17, bx: 100, chipX: 192 }
};
// Cỡ chữ vừa với bề rộng cho phép
const coVua = (t, co, maxW) => Math.max(12, Math.min(co, (maxW - 26) / Math.max(1, t.length * .56)));
function theTu(t, x, y, co, mau, key) {
  const w = rongChu(t, co);
  return `<g class="${(moi.has(key) ? 'moi' : '')}"><rect x="${x - w / 2}" y="${y - 16}" width="${w}" height="32" rx="16" fill="#fff" stroke="${mau}" stroke-width="2.5"/>${chuSvg(x, y, co, '#1f2a44', t)}</g>`;
}
function veP2() {
  veLai = veP2;
  const hop = $('#soDoHop');
  if (!hop || !p2) return;
  const k = kieu(), K = P2KHUON[k], cl = key => (moi.has(key) ? ' moi' : ''), lot = [], tren = [];
  const ten = p2.ten || '', cw = Math.min(K.maxCw, Math.max(K.cw, rongChu(ten, K.co + 2) + 10)), coGiua = coVua(ten, K.co + 2, cw);
  const [cx, cy] = K.c;
  const choTrong = (x, y) => `<rect x="${x - K.bw / 2}" y="${y - K.bh / 2}" width="${K.bw}" height="${K.bh}" rx="14" fill="#fafafa" stroke="#d5d9e8" stroke-width="2.5" stroke-dasharray="7 6"/>`;
  const oNhanh = (n, i, x, y) => {
    const mau = n.daMau ? n.mau : XAM;
    return `<g class="bam${cl('n-p2-' + i)}${cl('m-p2-' + i)}" data-nhanh="p2-${i}"><rect x="${x - K.bw / 2}" y="${y - K.bh / 2}" width="${K.bw}" height="${K.bh}" rx="14" fill="${n.daMau ? n.mau : '#eef0f5'}" stroke="${mau}" stroke-width="2.5"/>
      ${chuSvg(x, y, coVua(n.ten, K.co, K.bw), n.daMau ? '#fff' : '#1f2a44', n.ten)}</g>`;
  };
  const duong = (d, mau, day, key) => `<path d="${d}" fill="none" stroke="${mau}" stroke-width="${day}" stroke-linecap="round" class="${key ? cl(key).trim() : ''}"/>`;
  let h;
  if (k === 'rong') {
    // Cao vừa đủ: nhánh dưới chưa có từ khóa thì không chừa chỗ, để ô gõ chữ vẫn nằm trong màn hình
    const [, yDuoi] = K.vt[2], coTuDuoi = p2.nhanh[2] && p2.nhanh[2].tu.length;
    h = yDuoi + K.bh / 2 + (coTuDuoi ? 40 + 16 + 4 : 12);
    K.vt.slice(0, P2C.soNhanh).forEach(([x, y], i) => {
      const n = p2.nhanh[i];
      if (!n) { if (p2.buoc <= 1) tren.push(choTrong(x, y)); return; }
      const mau = n.daMau ? n.mau : XAM;
      if (i < 2) {
        // Nhánh ở trên: nối từ cạnh chủ đề chính sang; từ khóa xếp dọc dưới nhánh, mỗi từ một đường nối riêng
        const s = i === 0 ? -1 : 1, x1 = cx + s * (cw / 2 - 8), x2 = x - s * K.bw / 2, g = (x1 + x2) / 2;
        lot.push(duong(`M${x1} ${cy} C${g} ${cy} ${g} ${y} ${x2} ${y}`, mau, 5, 'n-p2-' + i));
        const sx = x + s * (K.bw / 2 - 12), sy = y + K.bh / 2;
        n.tu.forEach((t, j) => {
          const co = coVua(t, K.coNho, K.bw), w = rongChu(t, co), ty = sy + 32 + j * 44;
          const canh = x + s * (K.bw / 2 - 26), tx = canh - s * w / 2;
          lot.push(duong(`M${sx} ${sy} C${sx} ${ty} ${sx} ${ty} ${canh} ${ty}`, mau, 3, 't-p2-' + i + '-' + t));
          tren.push(theTu(t, tx, ty, co, mau, 't-p2-' + i + '-' + t));
        });
      } else {
        // Nhánh ở dưới: từ khóa xếp thành hàng ngang, mỗi từ một đường tỏa xuống
        const y1 = cy + K.ch / 2, y2 = y - K.bh / 2, g = (y1 + y2) / 2;
        lot.push(duong(`M${cx} ${y1} C${cx} ${g} ${x} ${g} ${x} ${y2}`, mau, 5, 'n-p2-' + i));
        const cos = n.tu.map(t => coVua(t, K.coNho, K.bw)), ws = n.tu.map((t, j) => rongChu(t, cos[j]));
        let tx = x - (ws.reduce((a, b) => a + b, 0) + 18 * (ws.length - 1)) / 2;
        const ty = y + K.bh / 2 + 40, sy = y + K.bh / 2;
        n.tu.forEach((t, j) => {
          const mx = tx + ws[j] / 2, gy = (sy + ty - 16) / 2;
          lot.push(duong(`M${x} ${sy} C${x} ${gy} ${mx} ${gy} ${mx} ${ty - 16}`, mau, 3, 't-p2-' + i + '-' + t));
          tren.push(theTu(t, mx, ty, cos[j], mau, 't-p2-' + i + '-' + t));
          tx += ws[j] + 18;
        });
      }
      tren.push(oNhanh(n, i, x, y));
    });
  } else {
    // Điện thoại: chủ đề chính ở trên; các nhánh xếp dọc bên trái, từ khóa xếp dọc bên phải nhánh
    let top = cy + K.ch / 2 + 30, cuoi = cy;
    const than = [];
    for (let i = 0; i < P2C.soNhanh; i++) {
      const n = p2.nhanh[i];
      if (!n && p2.buoc > 1) break;
      const so = n ? n.tu.length : 0, cao = Math.max(K.bh + 10, so * 42), by = top + cao / 2, x = K.bx;
      cuoi = by;
      if (!n) { tren.push(choTrong(x, by)); top += cao + 18; continue; }
      const mau = n.daMau ? n.mau : XAM;
      than.push(duong(`M14 ${by - 30} Q14 ${by} ${x - K.bw / 2} ${by}`, mau, 5, 'n-p2-' + i));
      const chipMax = K.w - K.chipX - 6, sx = x + K.bw / 2;
      n.tu.forEach((t, j) => {
        const co = coVua(t, K.coNho, chipMax), w = rongChu(t, co), ty = by - (so - 1) * 21 + j * 42;
        lot.push(duong(`M${sx} ${by} C${sx + 10} ${by} ${sx + 10} ${ty} ${K.chipX} ${ty}`, mau, 3, 't-p2-' + i + '-' + t));
        tren.push(theTu(t, K.chipX + w / 2, ty, co, mau, 't-p2-' + i + '-' + t));
      });
      tren.push(oNhanh(n, i, x, by));
      top += cao + 18;
    }
    // Thân chung màu xám từ chủ đề chính xuống nhánh cuối
    if (cuoi > cy) lot.unshift(duong(`M${cx - cw / 2 + 6} ${cy} C14 ${cy} 14 ${cy} 14 ${cy + 40} L14 ${cuoi - 30}`, '#cbd2e0', 5));
    lot.push(...than);
    h = Math.max(top + 4, cy + K.ch / 2 + 40);
  }
  const giua = ten
    ? `<g class="${cl('giua').trim()}"><rect x="${cx - cw / 2}" y="${cy - K.ch / 2}" width="${cw}" height="${K.ch}" rx="${K.ch / 2}" fill="#FF9600"/>${chuSvg(cx, cy, coGiua, '#fff', ten, ' font-weight="900"')}</g>`
    : `<rect x="${cx - cw / 2}" y="${cy - K.ch / 2}" width="${cw}" height="${K.ch}" rx="${K.ch / 2}" fill="#fafafa" stroke="#d5d9e8" stroke-width="2.5" stroke-dasharray="7 6"/>${chuSvg(cx, cy, K.co + 4, '#b6bccb', '?')}`;
  hop.innerHTML = `<svg class="so-do" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${K.w} ${h}" width="${K.w}" height="${h}" role="img" aria-label="Sơ đồ tư duy của em">${lot.join('')}${giua}${tren.join('')}</svg>`;
  moi.clear();
  $$('[data-nhanh]', hop).forEach(g => g.addEventListener('click', () => { if (bamNhanh) bamNhanh(g.dataset.nhanh); }));
}

function manDauP2() {
  clearTimeout(S.hen);
  bamNhanh = null;
  $('#tenPhan').textContent = 'Phần 2 · Sơ đồ về em';
  $('#tienDo').innerHTML = '';
  $('#man').innerHTML = `<div class="the">
      <h2>Giờ em tự vẽ sơ đồ tư duy về chính em nhé!</h2>
      <p>Em làm từng bước giống lúc giúp bạn An.</p>
      <button type="button" class="nut-chinh" id="nutP2">Bắt đầu</button><button type="button" class="nut-phu" id="nutGiay">Em vẽ trên giấy</button>
    </div>`;
  $('#nutP2').addEventListener('click', () => { p2 = { ten: '', nhanh: [], buoc: 0 }; khungCau(); buocP2(0); });
  $('#nutGiay').addEventListener('click', manGiay);
}
function buocP2(b) {
  clearTimeout(S.hen);
  p2.buoc = b;
  S.khoa = false;
  veTienDo(soBuocP2(), b);
  bamNhanh = b === soBuocP2() - 1 ? toMauP2 : null;
  veP2();
  $('#cauGoi').hidden = true;
  baoTin('', '');
  const vung = $('#vung');
  if (b === 0) {
    $('#hoi').textContent = 'Gõ tên em vào giữa sơ đồ.';
    vung.innerHTML = `<form class="go" id="formGo"><input id="oGo" maxlength="${P2C.daiTen}" autocomplete="off" placeholder="Tên em" aria-label="Tên em"><button type="submit" class="nut-chon">Xong</button></form>`;
    $('#formGo').addEventListener('submit', e => {
      e.preventDefault();
      if (S.khoa) return;
      const t = $('#oGo').value.trim().replace(/\s+/g, ' ');
      if (!t) { baoTin('sai', 'Em gõ tên của em vào ô nhé.'); return; }
      p2.ten = t; moi.add('giua'); tieng(true);
      xongBuoc('Hay lắm! Tên em nằm ở giữa sơ đồ.');
    });
    $('#oGo').focus({ preventScroll: true });
    return;
  }
  if (b === 1) {
    $('#hoi').textContent = `Chọn ${P2C.soNhanh} nhánh cho sơ đồ của em.`;
    vung.innerHTML = nutHTML(P2C.nhanh.map(n => ({ t: n.ten })));
    $$('#dsNut .nut-chon').forEach((nut, k) => nut.addEventListener('click', () => {
      if (S.khoa || nut.disabled) return;
      const n = P2C.nhanh[k];
      p2.nhanh.push({ ten: n.ten, mau: n.mau, goiY: n.goiY, tu: [], daMau: false });
      moi.add('n-p2-' + (p2.nhanh.length - 1)); tieng(true);
      nut.classList.add('dung'); nut.disabled = true;
      veP2();
      const con = P2C.soNhanh - p2.nhanh.length;
      if (con > 0) { baoTin('dung', `Còn ${con} nhánh nữa.`); return; }
      $$('#dsNut .nut-chon').forEach(x => { x.disabled = true; });
      xongBuoc('Hay lắm! Mỗi nhánh là một ý lớn về em.');
    }));
    return;
  }
  if (b < 2 + P2C.soNhanh) { buocTuKhoa(b - 2); return; }
  $('#hoi').textContent = 'Bấm từng nhánh để tô màu.';
  vung.innerHTML = nutHTML(p2.nhanh.map(n => ({ t: n.ten })));
  $$('#dsNut .nut-chon').forEach((nut, k) => nut.addEventListener('click', () => toMauP2('p2-' + k)));
}
function xongBuoc(loiKhen) {
  S.khoa = true;
  baoTin('dung', loiKhen);
  S.hen = setTimeout(() => buocP2(p2.buoc + 1), CAU_HINH.choSangCauMs);
}
// Gõ từ khóa cho một nhánh: ít nhất 1, nhiều nhất toiDaTu; có gợi ý khi em bí
function buocTuKhoa(i) {
  const n = p2.nhanh[i];
  $('#hoi').textContent = `Gõ từ khóa cho nhánh “${n.ten}”.`;
  $('#vung').innerHTML = `<form class="go" id="formGo"><input id="oGo" maxlength="${P2C.daiTu + 10}" autocomplete="off" placeholder="Ví dụ: ${esc(n.goiY[0])}" aria-label="Từ khóa cho nhánh ${esc(n.ten)}"><button type="submit" class="nut-chon">Thêm</button><button type="button" class="nut-chon nut-tiep" id="nutTiep" hidden>Tiếp</button></form>
    <div class="goi-y-hop"><button type="button" class="nut-nho" id="nutGoiY">Xem gợi ý</button><div class="goi-y" id="goiY" hidden>${n.goiY.map(g => `<button type="button" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div></div>`;
  const them = t => {
    if (S.khoa) return;
    t = t.trim().replace(/\s+/g, ' ');
    if (!t) { baoTin('sai', 'Em gõ một từ khóa vào ô nhé.'); return; }
    if (t.length > P2C.daiTu || t.split(' ').length > 3) { tieng(false); baoTin('sai', 'Từ khóa nên thật ngắn, chỉ 1–3 tiếng thôi. Em viết gọn lại nhé.'); return; }
    if (n.tu.includes(t)) { baoTin('sai', 'Em đã có từ khóa này rồi.'); return; }
    n.tu.push(t); moi.add('t-p2-' + i + '-' + t); tieng(true);
    veP2();
    $('#oGo').value = '';
    if (n.tu.length >= P2C.toiDaTu) { $('#formGo').hidden = true; $('.goi-y-hop').hidden = true; $('#nutTiep').hidden = true; xongBuoc('Hay lắm! Nhánh này đã có từ khóa.'); return; }
    baoTin('dung', 'Hay lắm! Em thêm từ nữa, hoặc bấm Tiếp.');
    $('#nutTiep').hidden = false;
    $('#oGo').focus({ preventScroll: true });
  };
  $('#formGo').addEventListener('submit', e => { e.preventDefault(); them($('#oGo').value); });
  $('#nutGoiY').addEventListener('click', () => { $('#goiY').hidden = false; $('#nutGoiY').hidden = true; });
  $$('#goiY [data-g]').forEach(g => g.addEventListener('click', () => them(g.dataset.g)));
  $('#nutTiep').addEventListener('click', () => { if (!S.khoa) buocP2(p2.buoc + 1); });
  $('#oGo').focus({ preventScroll: true });
}
function toMauP2(key) {
  const i = +String(key).replace('p2-', ''), n = p2.nhanh[i];
  if (!n || n.daMau || S.khoa || p2.buoc !== soBuocP2() - 1) return;
  n.daMau = true; moi.add('m-' + key); tieng(true);
  veP2();
  const b = $$('#dsNut .nut-chon')[i];
  if (b) { b.classList.add('dung'); b.disabled = true; }
  const con = p2.nhanh.filter(x => !x.daMau).length;
  if (con > 0) { baoTin('dung', `Còn ${con} nhánh nữa.`); return; }
  S.khoa = true;
  baoTin('dung', 'Tuyệt vời! Sơ đồ của em đã xong.');
  S.hen = setTimeout(manXongP2, CAU_HINH.choSangCauMs);
}
function manXongP2() {
  bamNhanh = null;
  veTienDo(soBuocP2(), soBuocP2());
  manXongChung('Em đã vẽ xong sơ đồ về chính em!', '<p id="daLuu">Em bấm “Lưu ảnh” để giữ lại sơ đồ nhé.</p>',
    '<button type="button" class="nut-chinh" id="nutLuu">Lưu ảnh</button><button type="button" class="nut-phu" id="nutLaiP2">Vẽ lại</button>');
  $('#nutLuu').addEventListener('click', luuAnh);
  $('#nutLaiP2').addEventListener('click', manDauP2);
}
// Lưu sơ đồ thành ảnh PNG
function luuAnh() {
  const svg = $('.so-do');
  if (!svg) return;
  const w = svg.viewBox.baseVal.width, h = svg.viewBox.baseVal.height, k = 2;
  let src = new XMLSerializer().serializeToString(svg);
  src = src.replace('<svg ', `<svg style="font-family:Nunito,'Segoe UI',Arial,sans-serif;font-weight:800" `);
  const url = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = w * k; cv.height = h * k;
    const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(b => {
      if (!b) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'so-do-tu-duy-' + (p2.ten || 'cua-em').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      window.__anhDaLuu = a.download;
      $('#daLuu').textContent = 'Đã lưu ảnh “' + a.download + '”. Em có thể gửi ảnh này cho thầy cô.';
    }, 'image/png');
  };
  img.src = url;
}
// Em vẽ trên giấy: làm theo 4 bước rồi chọn ảnh chụp để xem lại
function manGiay() {
  $('#tienDo').innerHTML = '';
  $('#man').innerHTML = `<div class="the">
      <h2>Vẽ sơ đồ trên giấy</h2>
      <ol>${P2C.giay.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
      <div class="anh-giay" id="anhGiay">Chưa có ảnh</div>
      <label class="nut-chinh chon-anh">Chọn ảnh chụp<input type="file" accept="image/*" id="oAnh"></label><button type="button" class="nut-phu" id="nutMay">Làm trên máy</button>
      <p class="ghi-chu">Ảnh chỉ hiện trên máy của em, không gửi đi đâu.</p>
    </div>`;
  $('#oAnh').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    $('#anhGiay').innerHTML = `<img src="${URL.createObjectURL(f)}" alt="Ảnh chụp sơ đồ tư duy của em">`;
    tieng(true);
  });
  $('#nutMay').addEventListener('click', manDauP2);
}

/* ---------- Khung đổi độ rộng qua ngưỡng: vẽ lại sơ đồ cho hợp ---------- */
let kieuCu = null;
window.addEventListener('resize', () => { const k = kieu(); if (k !== kieuCu) { kieuCu = k; veLai(); } });

/* ---------- Khi được nhúng vào trang bài học: báo trang đo lại chiều cao khung ---------- */
if ('ResizeObserver' in window) {
  let t;
  new ResizeObserver(() => {
    clearTimeout(t);
    t = setTimeout(() => { try { const f = window.frameElement; if (f && typeof f.__updateHeightFn === 'function') f.__updateHeightFn(); } catch (e) {} }, 60);
  }).observe(document.body);
}

veLoa();
manDau();
</script>
