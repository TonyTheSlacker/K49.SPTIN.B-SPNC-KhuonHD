<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Giải thích thuật ngữ Tin học lớp 6 theo từng bài học, có tìm kiếm và lọc theo bài.">
  <title>Nội dung trọng tâm — Hỗ trợ Tin học 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261103">
  <style>
    .dictionary-hero {
      margin-top: 16px;
      text-align: left;
    }

    .dictionary-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-top: 22px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 181, 71, 0.22);
      box-shadow: 0 12px 28px rgba(60, 49, 22, 0.08);
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .search-box:focus-within {
      border-color: rgba(217, 137, 0, 0.56);
      box-shadow: 0 14px 30px rgba(255, 186, 53, 0.18);
      transform: translateY(-1px);
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      color: var(--ink);
    }

    .search-box input::placeholder {
      color: var(--muted);
      opacity: 0.82;
    }

    .search-box input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
      border-radius: 6px;
    }

    .search-box span {
      font-size: 1.1rem;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .filter-pill {
      min-height: 42px;
      border: 0;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      font: inherit;
      font-weight: 800;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    a.filter-pill {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .filter-pill[aria-pressed="true"] {
      background: #1f2a44;
      color: #fff;
    }

    .filter-pill:hover {
      transform: translateY(-1px);
    }

    .filter-pill:active {
      transform: translateY(0);
    }

    .filter-pill:focus-visible {
      box-shadow: 0 0 0 3px var(--focus);
    }

    .dictionary-meta {
      margin-top: 18px;
      color: var(--muted);
      font-weight: 700;
    }

    .dictionary-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .dictionary-lessons {
      margin-top: 22px;
      display: grid;
      gap: 26px;
    }

    .lesson-terms__header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px;
    }

    .lesson-terms__header h3 {
      margin: 0;
      font-family: 'Baloo 2', cursive;
      font-size: 1.5rem;
      color: var(--ink);
    }

    .lesson-terms__count {
      color: var(--muted);
      font-weight: 700;
    }

    .lesson-terms__link {
      margin-left: auto;
      font-weight: 800;
      color: var(--ink);
    }

    .lesson-terms .dictionary-grid {
      margin-top: 14px;
    }

    .term-card {
      padding: 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 181, 71, 0.18);
      box-shadow: 0 12px 28px rgba(60, 49, 22, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .term-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 181, 71, 0.38);
      box-shadow: 0 18px 34px rgba(60, 49, 22, 0.12);
    }

    .term-card h3 {
      margin: 0 0 10px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.45rem;
    }

    .term-card .tag {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #ffe9bf;
      color: #845b00;
      font-size: 0.92rem;
      font-weight: 800;
    }

    .term-card p {
      margin: 0;
      line-height: 1.7;
      color: var(--muted);
    }

    .empty-state {
      margin-top: 22px;
      padding: 28px;
      border-radius: 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      color: var(--muted);
      box-shadow: 0 12px 28px rgba(60, 49, 22, 0.08);
    }

    .empty-state[hidden] {
      display: none !important;
    }

    body.theme-dark .search-box {
      background: rgba(18, 18, 18, 0.94);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
    }

    body.theme-dark .filter-pill {
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
    }

    body.theme-dark .filter-pill[aria-pressed="true"] {
      background: linear-gradient(180deg, #ffe39d 0%, #ffc94d 100%);
      color: #1f2a44;
    }

    body.theme-dark .term-card {
      background: rgba(18, 18, 18, 0.94);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    body.theme-dark .term-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.42);
    }

    body.theme-dark .term-card .tag {
      background: rgba(255, 228, 158, 0.16);
      color: #ffe39d;
    }

    body.theme-dark .empty-state {
      background: rgba(18, 18, 18, 0.92);
      color: var(--muted);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    body.theme-dark .filter-pill:focus-visible {
      box-shadow: 0 0 0 3px var(--focus);
    }

    @media (max-width: 720px) {
      .dictionary-toolbar,
      .dictionary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">

    <div class="home-layout">

      <div class="home-content">

    <header class="hero dictionary-hero">
      <div class="hero__badge">Thuật ngữ theo từng bài</div>
      <h1>Nội dung trọng tâm</h1>
      <p>
        Những thuật ngữ quan trọng của từng bài học, giải thích ngắn gọn, dễ nhớ. Chọn bài học hoặc nhập từ khóa để tìm nhanh.
      </p>

      <div class="dictionary-toolbar">
        <label class="search-box" for="searchInput">
          <input id="searchInput" type="search" placeholder="Ví dụ: vật mang tin, byte, sơ đồ khối..." autocomplete="off">
        </label>
        <a class="filter-pill" href="index.html" aria-label="Quay lại trang chủ">Trang chủ</a>
      </div>

      <div class="filter-pills" id="lessonFilters" aria-label="Bộ lọc theo bài học"></div>
      <div class="dictionary-meta" id="resultCount" aria-live="polite"></div>
    </header>

    <main>
      <section aria-labelledby="dictionary-title">
        <h2 id="dictionary-title" class="section-heading" style="margin-top: 24px;">
          Từ vựng theo từng bài
        </h2>
        <div class="dictionary-lessons" id="dictionaryGrid"></div>
        <div class="empty-state" id="emptyState" hidden>
          Không tìm thấy thuật ngữ phù hợp. Hãy thử từ khóa khác nhé.
        </div>
      </section>
    </main>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js?v=20261103"></script>
  <script src="assets/js/glossary-data.js?v=20260804"></script>
  <script src="assets/js/dictionary.js?v=20260804"></script>
</body>
</html>
